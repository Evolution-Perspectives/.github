name: Engine / Managed workflows deploy

on:
  workflow_call:
    inputs:
      dry_run:
        description: Plan and report without writing. Safe by default.
        required: false
        type: boolean
        default: true
      repos:
        description: Comma-separated repository names to restrict the run to. Empty means all non-excluded repositories.
        required: false
        type: string
        default: ""
      rotate_secret:
        description: Overwrite the repo secret even when it exists.
        required: false
        type: boolean
        default: false
      runner:
        description: Runner label for the job. Empty or omitted means the GitHub-hosted ubuntu-latest; the managed callers in private repositories pass the label of the self-hosted pool.
        required: false
        type: string
        default: ubuntu-latest
    secrets:
      deploy_pat:
        description: Token with repo and workflow scope, able to write repo secrets. Required to write on the other repositories; never replaced by another token for a real run.
        required: false
      read_pat:
        description: Read-only use, for a dry run when no deploy_pat is available.
        required: false
      automation_pat:
        description: Value stored as the repo secret EP_AUTOMATION_PAT, only in repositories whose manifest entry enables manageSecret.
        required: false

jobs:
  deploy:
    name: Deploy the managed callers
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout the templates and the manifest
        uses: actions/checkout@v7

      - uses: Evolution-Perspectives/.github/actions/managed-deploy@main
        with:
          # A real run uses the deploy token only; a dry run may fall back to the read token.
          token: ${{ secrets.deploy_pat || (inputs.dry_run && secrets.read_pat) || '' }}
          secret_value: ${{ secrets.automation_pat }}
          dry_run: ${{ inputs.dry_run }}
          repos: ${{ inputs.repos }}
          rotate_secret: ${{ inputs.rotate_secret }}
