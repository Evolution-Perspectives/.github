name: CI / Workflow scripts

on:
  pull_request:
    paths:
      - .github/scripts/status-sync-workflows.test.js
      - .github/workflows/engine-sync-close-state.yml
      - .github/workflows/engine-sync-status-on-close.yml
      - .github/workflows/engine-remove-blocking-on-close.yml
      - actions/blocking-cleanup/**
      - .github/scripts/add-issue-workflow.test.js
      - .github/workflows/engine-add-issue-to-project.yml
      - .github/workflows/engine-delete-issue-on-project-removal.yml
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Status <-> issue close sync, add-to-project and blocking cleanup tests
        run: node --test .github/scripts/status-sync-workflows.test.js actions/blocking-cleanup/cleanup.test.js .github/scripts/add-issue-workflow.test.js
