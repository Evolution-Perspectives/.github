name: Delete issue on project removal
description: Permanently delete an issue that was removed from the project.
inputs:
  project_id:
    description: Projects v2 node ID considered as source of truth.
    required: true
  issue_node_id:
    description: Node ID of the issue to delete.
    required: true
  item_node_id:
    description: Optional project item node ID from the source event.
    required: false
    default: ""
  event_action:
    description: Source event action (for observability only).
    required: false
    default: removed
  source_repository:
    description: Repository where the source event originated.
    required: false
    default: unknown
  dry_run:
    description: If true, validate and summarize without deleting.
    required: false
    default: "false"
  debug:
    description: Enable verbose logs.
    required: false
    default: "false"
  token:
    description: PAT used for GitHub API calls.
    required: true
runs:
  using: composite
  steps:
    - name: Delete issue on project removal
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        PROJECT_ID: ${{ inputs.project_id }}
        ISSUE_NODE_ID: ${{ inputs.issue_node_id }}
        ITEM_NODE_ID: ${{ inputs.item_node_id }}
        EVENT_ACTION: ${{ inputs.event_action }}
        SOURCE_REPOSITORY: ${{ inputs.source_repository }}
        DRY_RUN: ${{ inputs.dry_run }}
        DEBUG: ${{ inputs.debug }}
        ACTION_PATH: ${{ github.action_path }}
      with:
        github-token: ${{ inputs.token }}
        retries: 1
        script: |
          const run = require(`${process.env.ACTION_PATH}/delete.js`);
          await run({ github, core });
