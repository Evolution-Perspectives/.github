name: Add issue to project
description: Add an issue to the org project and optionally set its Status.
inputs:
  project_id:
    description: Node ID of the target GitHub Projects v2 project.
    required: true
  issue_node_id:
    description: Node ID of the issue to add to the project.
    required: true
  issue_number:
    description: Number of the issue, for reporting.
    required: false
    default: unknown
  source_repository:
    description: Repository where the issue was opened.
    required: false
    default: unknown
  dry_run:
    description: Validate and report without calling the mutation.
    required: false
    default: "false"
  debug:
    description: Enable verbose logs.
    required: false
    default: "false"
  status_name:
    description: Name of the Status option to set when the issue is added (for example "📦 Backlog"). Resolved live from the project; skipped if empty.
    required: false
    default: ""
  token:
    description: PAT used for GitHub API calls.
    required: true
runs:
  using: node24
  main: dist/index.js
