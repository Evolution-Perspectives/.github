name: Engine / Delete issue on project removal

on:
  workflow_call:
    inputs:
      project_id:
        description: Projects v2 node ID considered as source of truth.
        required: true
        type: string
      issue_node_id:
        description: Node ID of the issue to delete.
        required: true
        type: string
      item_node_id:
        description: Optional project item node ID from the source event.
        required: false
        type: string
        default: ""
      event_action:
        description: Source event action (for observability only).
        required: false
        type: string
        default: removed
      source_repository:
        description: Repository where the source event originated.
        required: false
        type: string
        default: unknown
      dry_run:
        description: If true, validate and summarize without deleting.
        required: false
        type: string
        default: "false"
      debug:
        description: Enable verbose logs.
        required: false
        type: string
        default: "false"
      runner:
        description: Runner label for the job. Empty or omitted means the GitHub-hosted ubuntu-latest; the managed callers in private repositories pass the label of the self-hosted pool.
        required: false
        type: string
        default: ubuntu-latest
    secrets:
      automation_pat:
        description: PAT with permission to delete issues in target repositories.
        required: true

jobs:
  delete-issue:
    name: Delete issue removed from project
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: Evolution-Perspectives/.github/actions/delete-on-removal@main
        with:
          project_id: ${{ inputs.project_id }}
          issue_node_id: ${{ inputs.issue_node_id }}
          item_node_id: ${{ inputs.item_node_id }}
          event_action: ${{ inputs.event_action }}
          source_repository: ${{ inputs.source_repository }}
          dry_run: ${{ inputs.dry_run }}
          debug: ${{ inputs.debug }}
          token: ${{ secrets.automation_pat }}
