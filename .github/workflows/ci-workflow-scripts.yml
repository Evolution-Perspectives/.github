name: CI / Actions and workflow scripts

on:
  pull_request:
    paths:
      - actions/**
      - lib/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - rollup.config.mjs
      - .node-version
      - .github/workflows/engine-*.yml
      - .github/workflows/ci-workflow-scripts.yml
      - .github/scripts/check-actions-layout*.js
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Check actions/ and engine-*.yml layout
        run: node .github/scripts/check-actions-layout.js

      - name: Run TypeScript tests
        run: npm test

      - name: Test the layout check
        run: node --test .github/scripts/check-actions-layout.test.js
