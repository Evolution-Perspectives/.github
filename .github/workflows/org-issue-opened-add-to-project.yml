name: Org / Issue opened → add to project

on:
  issues:
    types:
      - opened
  workflow_dispatch:
    inputs:
      project_id:
        description: Override project ID for manual run.
        required: false
        type: string
      issue_node_id:
        description: Issue node ID to add.
        required: true
        type: string
      issue_number:
        description: Issue number, for reporting.
        required: false
        type: string
      dry_run:
        description: Validate only, no mutation.
        required: false
        default: true
        type: boolean
      debug:
        description: Enable verbose logs.
        required: false
        default: false
        type: boolean
      status_name:
        description: Status option name to set on add (default "📦 Backlog"); resolved live from the project.
        required: false
        type: string

jobs:
  add-issue-to-project:
    uses: Evolution-Perspectives/.github/.github/workflows/engine-add-issue-to-project.yml@main
    with:
      project_id: ${{ github.event_name == 'workflow_dispatch' && inputs.project_id || 'PVT_kwDOCIcusc4BOGrD' }}
      issue_node_id: ${{ github.event_name == 'workflow_dispatch' && inputs.issue_node_id || github.event.issue.node_id }}
      issue_number: ${{ github.event_name == 'workflow_dispatch' && inputs.issue_number || github.event.issue.number }}
      source_repository: ${{ github.repository }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      debug: ${{ github.event_name == 'workflow_dispatch' && inputs.debug || false }}
      status_name: ${{ github.event_name == 'workflow_dispatch' && inputs.status_name || '📦 Backlog' }}
    secrets:
      automation_pat: ${{ secrets.EP_AUTOMATION_PAT }}
