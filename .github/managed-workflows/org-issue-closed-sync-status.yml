# MANAGED by Evolution-Perspectives/.github (.github/managed-workflows). Do not edit here: the next deploy overwrites this file.
name: Org / Issue closed → sync Status

# Event-driven only: no manual trigger and no inputs, because this file runs with the org token.
on:
  issues:
    types:
      - closed

# One issue is handled by one run at a time and in order (opened, then closed). `queue: max` keeps every
# event instead of replacing the pending one, so nothing is lost when many things happen at once.
concurrency:
  group: org-issue-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false
  queue: max

jobs:
  sync-status:
    uses: Evolution-Perspectives/.github/.github/workflows/engine-sync-status-on-close.yml@__REF__
    with:
      runner: __RUNNER__
      project_id: PVT_kwDOCIcusc4BOGrD
      issue_node_id: ${{ github.event.issue.node_id }}
      state_reason: ${{ github.event.issue.state_reason }}
      source_repository: ${{ github.repository }}
    secrets:
      automation_pat: ${{ secrets.EP_AUTOMATION_PAT }}
