name: Ops / Refresh project schema

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-project-schema
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    env:
      GH_TOKEN: ${{ secrets.EP_AUTOMATION_PAT }}
      BRANCH: chore/project-schema-refresh
      BASE: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.EP_AUTOMATION_PAT }}

      - name: Regenerate docs/project-schema
        run: node .github/scripts/refresh-project-schema.js

      - name: Open or update PR when the schema changed
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain docs/project-schema)" ]; then
            echo "No schema drift."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add docs/project-schema
          git commit -m "chore: refresh project schema snapshot"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            gh pr create --base "$BASE" --head "$BRANCH" \
              --title "chore: refresh project schema snapshot" \
              --body "The org Project structure changed on GitHub (fields, options, issue types or views). Review the diff: a renamed or removed option may affect automations that reference it. Generated by \`.github/scripts/refresh-project-schema.js\`."
          fi
