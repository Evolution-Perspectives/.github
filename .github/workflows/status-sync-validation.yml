name: Status Sync Validation

on:
  pull_request:
    paths:
      - .github/scripts/status-sync-workflows.test.js
      - .github/workflows/action-status-sync-issue-close.yml
      - .github/workflows/action-close-issue-sync-status.yml
      - .github/workflows/action-remove-blocking-on-close.yml
      - .github/scripts/remove-blocking-workflow.test.js
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Status <-> issue close sync and blocking cleanup tests
        run: node --test .github/scripts/status-sync-workflows.test.js .github/scripts/remove-blocking-workflow.test.js
