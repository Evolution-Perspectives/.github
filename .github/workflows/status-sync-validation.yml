name: Status Sync Validation

on:
  pull_request:
    paths:
      - .github/scripts/status-sync-workflows.test.js
      - .github/workflows/action-status-sync-issue-close.yml
      - .github/workflows/action-close-issue-sync-status.yml
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Status <-> issue close sync tests
        run: node --test .github/scripts/status-sync-workflows.test.js
