name: Status to close state sync
description: Close or reopen an issue from its project Status.
inputs:
  project_id:
    description: Projects v2 node ID considered as source of truth.
    required: true
  item_node_id:
    description: Projects v2 item node ID whose Status field changed.
    required: true
  source_repository:
    description: Repository where the source event originated.
    required: false
    default: unknown
  dry_run:
    description: If true, validate and summarize without closing/reopening the issue.
    required: false
    default: "false"
  debug:
    description: Enable verbose logs.
    required: false
    default: "false"
  token:
    description: PAT used for GitHub API calls.
    required: true
runs:
  using: node24
  main: dist/index.js
