name: Delete issue on project removal
description: Permanently delete an issue that was removed from the project.
inputs:
  project_id:
    description: Projects v2 node ID considered as source of truth.
    required: true
  issue_node_id:
    description: Node ID of the issue to delete.
    required: true
  item_node_id:
    description: Optional project item node ID from the source event.
    required: false
    default: ""
  event_action:
    description: Source event action (for observability only).
    required: false
    default: removed
  source_repository:
    description: Repository where the source event originated.
    required: false
    default: unknown
  dry_run:
    description: If true, validate and summarize without deleting.
    required: false
    default: "false"
  debug:
    description: Enable verbose logs.
    required: false
    default: "false"
  token:
    description: PAT used for GitHub API calls.
    required: true
runs:
  using: node24
  main: dist/index.js
